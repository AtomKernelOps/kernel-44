
<div class="card">
    <div id="kilo-chat" class="stream"></div>
    <input id="q" placeholder="Architectural query...">
    <button onclick="askKilo()">Consult Kilo</button>
</div>

<script>
    async function askKilo() {
        const query = document.getElementById('q').value;
        const chat = document.getElementById('kilo-chat');
        chat.innerHTML += `<div>Founder: ${query}</div>`;

        // This calls the Vercel Serverless function we will create
        const response = await fetch('/api/kilo', {
            method: 'POST',
            body: JSON.stringify({ prompt: query })
        });
        const data = await response.json();
        chat.innerHTML += `<div class="agent">Kilo: ${data.reply}</div>`;
    }
</script>
