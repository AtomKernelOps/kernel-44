<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | AI OS</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .agent-id { color: #007aff; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; }
        textarea { width: 100%; height: 80px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; box-sizing: border-box; }
        button { background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>
    <div class="card">
        <div class="agent-id">KILO // LEAD ENGINEER</div>
        <div id="status">System operational. Command Stream active.</div>
    </div>
    
    <div class="card">
        <textarea id="cmd" placeholder="Enter instructions for the OS..."></textarea>
        <button onclick="execute()">EXECUTE BLUEPRINT</button>
    </div>

    <script>
        function execute() {
            const cmd = document.getElementById('cmd').value;
            if(!cmd) return;
            document.getElementById('status').innerText = "Processing: " + cmd;
            document.getElementById('cmd').value = "";
            console.log("Kernel-44 Executing:", cmd);
        }
    </script>
</body>
</html>
