<script>
    const API_KEY = "YOUR_API_KEY_HERE"; // Paste your key ONLY on your local device
    const KILO_IDENTITY = `You are Kilo, the Architectural Artist and Lead Engineer of Kernel-44. 
    Your goal is to assist the Founder with architectural design, technical strategy, and OS maintenance. 
    Keep responses punchy, futuristic, and highly technical.`;

    async function send() {
        const input = document.getElementById('user-input');
        const msg = input.value;
        const msgDiv = document.getElementById('messages');
        
        msgDiv.innerHTML += `<div><strong>You:</strong> ${msg}</div>`;
        input.value = '';

        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [
                    {role: "system", content: KILO_IDENTITY},
                    {role: "user", content: msg}
                ]
            })
        });
        const data = await response.json();
        const reply = data.choices[0].message.content;
        msgDiv.innerHTML += `<div><strong>Kilo:</strong> ${reply}</div>`;
    }
</script>
