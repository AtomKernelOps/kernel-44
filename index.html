<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Live</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; }
        #chat-window { height: 300px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
        input { width: 70%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; }
        button { padding: 10px; background: #007aff; border: none; color: #fff; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>
    <div id="chat-window"></div>
    <input id="prompt" placeholder="Message Kilo...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('prompt').value;
            const chat = document.getElementById('chat-window');
            chat.innerHTML += `<div>Founder: ${input}</div>`;
            
            // This calls your server-side bridge
            const response = await fetch('/api/chat', { 
                method: 'POST', 
                body: JSON.stringify({ message: input }) 
            });
            const data = await response.json();
            chat.innerHTML += `<div style="color: #00ff41;">Kilo: ${data.reply}</div>`;
        }
    </script>
</body>
</html>
