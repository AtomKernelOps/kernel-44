```html
<script>
    // Paste your OpenAI API Key into this variable only in your private repo
    const API_KEY = "YOUR_OPENAI_API_KEY_HERE";

    async function chatWithKilo(message) {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [
                    { role: "system", content: "You are Kilo, the Architectural Artist and Lead Engineer of Kernel-44. Answer with technical precision, visionary flair, and deep respect for the Founder." },
                    { role: "user", content: message }
                ]
            })
        });
        const data = await response.json();
        return data.choices[0].message.content;
    }
</script>
