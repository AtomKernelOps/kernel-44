<div class="card">

<script>
    const KILO_LIBRARY = {
        "status": "System sovereign. All modules online. No external dependencies.",
        "architect": "Kilo | The Architectural Artist. Vision: Modular, atomic, scalable.",
        "next": "Deploy the 'Task-Tracker' Atom to the index.html file."
    };

    function queryOS() {
        let q = document.getElementById('q').value.toLowerCase();
        let res = KILO_LIBRARY[q] || "Query not found in local library.";
        document.getElementById('os-response').innerText = "> " + res;
    }
</script>
