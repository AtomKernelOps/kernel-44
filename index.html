<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Live OS</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; }
        #input-area { padding: 20px; border-top: 1px solid #333; display: flex; }
        input { flex: 1; background: #222; border: none; padding: 10px; color: #fff; border-radius: 5px; }
        button { margin-left: 10px; background: #007aff; border: none; padding: 10px 20px; border-radius: 5px; color: white; }
    </style>
</head>
<body>
    <div id="chat-window">
        <div style="color: #00ff41;">Kilo: OS Bridge active. I am now listening inside the Kernel.</div>
    </div>
    <div id="input-area">
        <input id="user-input" placeholder="Architectural command...">
        <button onclick="sendCommand()">Send</button>
    </div>

    <script>
        function sendCommand() {
            const input = document.getElementById('user-input');
            const window = document.getElementById('chat-window');
            window.innerHTML += `<div>Founder: ${input.value}</div>`;
            // In a live integration, this calls your API endpoint
            input.value = '';
        }
    </script>
</body>
</html>
