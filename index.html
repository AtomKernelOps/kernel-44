<!-- Add this section to your index.html -->
<div id="kilo-chat" class="card" style="margin-top: 20px;">
    <div class="agent-name">KILO | ARCHITECT</div>
    <div id="chat-stream" style="height: 100px; overflow-y: auto; margin: 10px 0; border: 1px solid #333; padding: 5px;"></div>
    <input id="chat-input" style="width: 70%;" placeholder="Architectural query...">
    <button onclick="sendToKilo()">Send</button>
</div>

<script>
    async function sendToKilo() {
        const input = document.getElementById('chat-input').value;
        const stream = document.getElementById('chat-stream');
        stream.innerHTML += `<div><strong>You:</strong> ${input}</div>`;
        
        // This connects to the OpenAI Assistant API
        // We will bridge your API key via Vercel Environment Variables
        document.getElementById('chat-input').value = '';
    }
</script>
