<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 OS</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .agent-name { color: #007aff; font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; }
        #chat-stream { height: 150px; overflow-y: auto; background: #050505; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; }
        input { width: 70%; padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { padding: 8px 15px; background: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>

    <!-- AI Agent Status Section -->
    <div class="card">
        <div class="agent-name">AI AGENT FLEET</div>
        <div id="fleet-status">Operations: Standby | Strategy: Standby</div>
    </div>

    <!-- Kilo Communication Bridge -->
    <div class="card">
        <div class="agent-name">KILO (LEAD ENGINEER)</div>
        <div id="chat-stream">
            <div>Kilo: Systems online. Awaiting your directive.</div>
        </div>
        <input id="chat-input" placeholder="Consult Kilo...">
        <button onclick="sendToKilo()">Send</button>
    </div>

    <script>
        function sendToKilo() {
            const input = document.getElementById('chat-input');
            const stream = document.getElementById('chat-stream');
            if(input.value.trim() === "") return;
            
            stream.innerHTML += `<div>You: ${input.value}</div>`;
            console.log("Routing to Architecture Core:", input.value);
            input.value = '';
            stream.scrollTop = stream.scrollHeight;
        }
    </script>
</body>
</html>
