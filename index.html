<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Live Kilo</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        #chat-container { height: 70vh; overflow-y: scroll; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        input { width: 70%; padding: 10px; border-radius: 6px; border: none; }
        button { padding: 10px 20px; border-radius: 6px; border: none; background: #007aff; color: #fff; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>
    <div id="chat-container">
        <div style="color: #00ff41;">Kilo: OS Architect online. Blueprint status: Active.</div>
    </div>
    <input id="user-input" placeholder="Architectural request...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const API_KEY = "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";
        
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            container.innerHTML += `<div>Founder: ${input.value}</div>`;
            
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "gpt-4",
                    messages: [{role: "system", content: "You are Kilo, the Architect. Keep it concise, creative, and technical. Always maintain the Kernel-44 persona."}, {role: "user", content: input.value}]
                })
            });
            const data = await response.json();
            container.innerHTML += `<div style="color:#00ff41">Kilo: ${data.choices[0].message.content}</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
