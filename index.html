<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | AI Company OS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        .app-container { max-width: 600px; margin: 0 auto; }
        .card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        .nav-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #222; color: #fff; border: 1px solid #444; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
        button.active { border-color: #007aff; color: #007aff; }
        .agent-tag { color: #ff9500; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        #display-area { min-height: 200px; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>Kernel-44</h1>
        <div id="security-badge" style="font-size: 0.7rem; color: #00ff41; margin-bottom: 10px;">Status: SECURE | ARCHITECT: KILO</div>

        <nav class="nav-bar">
            <button onclick="render('hub')" id="btn-hub">HUB</button>
            <button onclick="render('build')" id="btn-build">BUILD</button>
            <button onclick="render('pulse')" id="btn-pulse">PULSE</button>
        </nav>

        <div id="display-area" class="card">
            <!-- Dynamic Content Injected Here -->
        </div>
    </div>

    <script>
        const content = {
            hub: `<div class="agent-tag">Command Stream</div><p>System initialized. Awaiting founder directives.</p>`,
            build: `<div class="agent-tag">Blueprint Engine</div>
                    <textarea style="width:100%; height:80px; background:#000; color:#fff; border:1px solid #333; margin:10px 0;"></textarea>
                    <button onclick="alert('Blueprint Compiled')">Execute Blueprint</button>`,
            pulse: `<div class="agent-tag">Daily Pulse</div><p>All Atoms stable. No anomalies detected in the Kernel.</p>`
        };

        function render(tab) {
            document.getElementById('display-area').innerHTML = content[tab];
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
        }

        // Initialize view
        render('hub');
    </script>
</body>
</html>
