    }

```html
<!-- Add this tab to your <nav> section -->
<button onclick="switchTab('brainstorm')">BRAINSTORM</button>

<!-- Add this tab content -->
<div id="brainstorm" class="tab content">
    <h3>Architectural Ideation</h3>
    <textarea id="brainDump" style="width: 100%; height: 120px;" placeholder="Dump your raw ideas here..."></textarea>
    <button onclick="captureIdea()">Capture & Refine</button>
    <div id="capturedList" style="margin-top: 10px;"></div>
</div>

<!-- Add this to your <script> section -->
<script>
    function captureIdea() {
        let dump = document.getElementById('brainDump').value;
        let list = document.getElementById('capturedList');
        // Logic to save the idea locally and send to CommHub
        list.innerHTML += `<div class="card" style="font-size:0.8rem;">${dump}</div>`;
        document.getElementById('brainDump').value = '';
        
        // This simulates the "Kilo" analysis
        console.log("Idea Captured. Awaiting refinement instructions.");
    }
</script>
```
