
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Live</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; }
        #chat { height: 300px; border: 1px solid #333; padding: 10px; overflow-y: scroll; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>
    <div id="chat"></div>
    <input id="input" style="width: 70%;" placeholder="Ask Kilo anything...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const API_KEY = "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";
        async function sendMessage() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div>You: ${input.value}</div>`;
            
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{role: "system", content: "You are Kilo, the Architect of Kernel-44. Be concise, visionary, and technical."},
                               {role: "user", content: input.value}]
                })
            });
            const data = await response.json();
            chat.innerHTML += `<div>Kilo: ${data.choices[0].message.content}</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
