<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Sovereign OS</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        .command-hub { border: 1px solid #333; padding: 15px; border-radius: 12px; background: #111; }
        .log { height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #00ff41; margin-bottom: 10px; }
        input { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Kernel-44 [SOVEREIGN]</h1>
    <div class="command-hub">
        <div id="log" class="log">> System initialized in Sovereign Mode...<br></div>
        <input id="input" placeholder="Enter command for Kilo..." onkeydown="handle(event)">
    </div>

    <script>
        function handle(e) {
            if (e.key === 'Enter') {
                let cmd = document.getElementById('input').value;
                let log = document.getElementById('log');
                log.innerHTML += `> Founder: ${cmd}<br>> Kilo: Executing ${cmd}... Logic archived.<br>`;
                document.getElementById('input').value = '';
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
