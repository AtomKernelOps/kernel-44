<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | AI Brain</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; }
        .card { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 10px; }
        #stream { height: 300px; overflow-y: auto; padding: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Kernel-44 OS</h1>
    <div id="stream" class="card">
        <div><span style="color:#007aff">KILO:</span> System linked. Ready for input.</div>
    </div>
    <div class="card">
        <input id="prompt" style="width: 70%; padding: 10px; background:#000; color:#fff; border:1px solid #444;" placeholder="Message the Kernel...">
        <button onclick="askBrain()">Send</button>
    </div>

    <script>
        async function askBrain() {
            const input = document.getElementById('prompt').value;
            const stream = document.getElementById('stream');
            stream.innerHTML += `<div><span style="color:#ff9500">YOU:</span> ${input}</div>`;
            
            // This is a free public inference gateway
            const response = await fetch('https://text.pollinations.ai/' + encodeURIComponent(input));
            const data = await response.text();
            
            stream.innerHTML += `<div><span style="color:#00ff41">BRAIN:</span> ${data}</div>`;
            document.getElementById('prompt').value = '';
        }
    </script>
</body>
</html>
