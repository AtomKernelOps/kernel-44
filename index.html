<!-- Add this section to your HTML where you want the chat to appear -->
<div class="card" id="kilo-bridge">
    <h3>Kilo | Architectural Bridge</h3>
    <div id="chat-stream" style="height: 150px; overflow-y: auto; background: #000; margin-bottom: 10px;"></div>
    <input id="user-input" style="width: 70%;" placeholder="Ask Kilo anything...">
    <button onclick="sendToKilo()">Transmit</button>
</div>

<script>
    async function sendToKilo() {
        const input = document.getElementById('user-input').value;
        const stream = document.getElementById('chat-stream');
        stream.innerHTML += `<div>Founder: ${input}</div>`;
        
        // This calls a serverless function we will create to protect your key
        const response = await fetch('/api/chat', {
            method: 'POST',
            body: JSON.stringify({ message: input })
        });
        const data = await response.json();
        stream.innerHTML += `<div style="color:#00ff41">Kilo: ${data.reply}</div>`;
    }
</script>
