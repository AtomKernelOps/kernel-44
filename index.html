<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | AI OS</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
        #chat-window { height: 250px; overflow-y: auto; margin-bottom: 10px; }
        input { width: 70%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; }
        button { padding: 10px; background: #007aff; color: white; border: none; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>
    <div id="chat-window" class="card">
        <div style="color: #007aff;">Kilo: OS Bridge initialized. Ready for commands.</div>
    </div>
    <div class="card">
        <input id="user-input" placeholder="Architectural command...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            chat.innerHTML += `<div>Founder: ${input.value}</div>`;
            
            // This connects your interface to the AI logic
            // We use a Vercel serverless function to keep your API key secure
            const response = await fetch('/api/chat', {
                method: 'POST',
                body: JSON.stringify({ message: input.value })
            });
            const data = await response.json();
            chat.innerHTML += `<div style="color: #007aff;">Kilo: ${data.reply}</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
