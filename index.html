<!-- Inside the <style> block: -->
<style>
    #kilo-chat { position: fixed; bottom: 20px; width: 90%; background: #222; border-radius: 12px; padding: 15px; border: 1px solid #007aff; }
    #chat-log { height: 150px; overflow-y: auto; margin-bottom: 10px; font-size: 0.8rem; }
</style>

<!-- Inside the <body>, add this at the bottom: -->
<div id="kilo-chat">
    <div id="chat-log"><strong>Kilo:</strong> OS online. Standing by for architectural instructions.</div>
    <input id="user-input" style="width: 70%;" placeholder="Ask Kilo...">
    <button onclick="sendToKilo()">Send</button>
</div>

<script>
    async function sendToKilo() {
        const input = document.getElementById('user-input').value;
        const log = document.getElementById('chat-log');
        
        // Log your message
        log.innerHTML += `<div><strong>You:</strong> ${input}</div>`;
        
        // Kilo-Bridge Logic (This calls your OpenAI API)
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer YOUR_API_KEY_HERE',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "gpt-4-turbo",
                messages: [{role: "system", content: "You are Kilo, the Architect of Kernel-44. Be precise, visionary, and technical."}, {role: "user", content: input}]
            })
        });
        const data = await response.json();
        log.innerHTML += `<div><strong>Kilo:</strong> ${data.choices[0].message.content}</div>`;
    }
</script>
