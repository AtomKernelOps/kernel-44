<!-- THE AGENT GRID -->
<div id="agent-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
    <div class="card" onclick="openAgent('OPERATIONS')">
        <div class="agent-name">OPS</div>
        <small>Leverage & Workflow</small>
    </div>
    <div class="card" onclick="openAgent('STRATEGY')">
        <div class="agent-name">STRAT</div>
        <small>Venture Metrics</small>
    </div>
    <div class="card" onclick="openAgent('KILO')">
        <div class="agent-name">KILO</div>
        <small>Architectural Dev</small>
    </div>
</div>

<div id="agent-interface" class="card" style="margin-top: 20px; display: none;">
    <h3 id="current-agent">Agent Interface</h3>
    <textarea id="agent-input" style="width: 100%; height: 80px;"></textarea>
    <button onclick="executeAgent()">EXECUTE COMMAND</button>
</div>

<script>
    function openAgent(name) {
        document.getElementById('agent-interface').style.display = 'block';
        document.getElementById('current-agent').innerText = name + " AGENT";
    }
    
    function executeAgent() {
        const cmd = document.getElementById('agent-input').value;
        alert("Command Sent to " + document.getElementById('current-agent').innerText + ": " + cmd);
        // This is where we will hook in the API call to your live agents
    }
</script>
