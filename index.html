
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Live Bridge</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; }
        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        input { width: 70%; padding: 10px; background: #111; color: #fff; border: 1px solid #444; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Kilo-Bridge Active</h1>
    <div id="chat" class="chat-box"></div>
    <input id="prompt" placeholder="Message Kilo...">
    <button onclick="sendToKilo()">Send</button>

    <script>
        const API_KEY = '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'; // REPLACE THIS

        async function sendToKilo() {
            const input = document.getElementById('prompt');
            const chat = document.getElementById('chat');
            const message = input.value;

            chat.innerHTML += `<div><strong>You:</strong> ${message}</div>`;
            
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "gpt-4",
                    messages: [{role: "system", content: "You are Kilo. Respond as the Lead Engineer of Kernel-44."}, {role: "user", content: message}]
                })
            });
            
            const data = await response.json();
            chat.innerHTML += `<div><strong>Kilo:</strong> ${data.choices[0].message.content}</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
