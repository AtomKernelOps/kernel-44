<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Live Terminal</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #00ff41; padding: 20px; }
        #terminal { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
        input { width: 100%; background: #111; color: #00ff41; border: 1px solid #333; padding: 10px; }
    </style>
</head>
<body>
    <h3>KILO TERMINAL</h3>
    <div id="terminal">Initializing connection...</div>
    <input id="prompt" placeholder="Input command or query..." onkeydown="if(event.key==='Enter') sendPrompt()">

    <script>
        async function sendPrompt() {
            const input = document.getElementById('prompt');
            const term = document.getElementById('terminal');
            term.innerHTML += `<div>> ${input.value}</div>`;
            
            // This logic sends your message to the Kilo Persona via the API
            // (You will need to use a simple backend proxy or just hardcode the key for personal use)
            input.value = '';
        }
    </script>
    <!-- Kilo Bridge Atom -->
<div class="card">
    <div class="agent-name">KILO | ENGINEERING BRIDGE</div>
    <div id="kilo-chat" style="font-size: 0.8rem; margin: 10px 0;">Standing by...</div>
    <input id="kilo-input" style="width: 70%;" placeholder="Command the OS...">
    <button onclick="executeKilo()">Execute</button>
</div>

<script>
    function executeKilo() {
        const cmd = document.getElementById('kilo-input').value;
        document.getElementById('kilo-chat').innerText = "Kilo: Architecting '" + cmd + "'...";
        // This is where we will hook your OpenAI API Key once you have it.
    }
</script>
</body>
</html>
