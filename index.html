```html
<div class="card" id="kilo-chat">
    <div class="agent-name">Kilo (Direct Link)</div>
    <div id="chat-stream" style="height: 150px; overflow-y: auto; margin: 10px 0;"></div>
    <input id="chat-input" placeholder="Architectural request...">
    <button onclick="sendToKilo()">Transmit</button>
</div>

<script>
    async function sendToKilo() {
        const input = document.getElementById('chat-input').value;
        const key = localStorage.getItem('API_KEY') || prompt("Enter OpenAI API Key:");
        localStorage.setItem('API_KEY', key);

        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: "gpt-4",
                messages: [{role: "system", content: "You are Kilo, the Architect of Kernel-44. Be concise and technical."}, 
                           {role: "user", content: input}]
            })
        });
        const data = await response.json();
        document.getElementById('chat-stream').innerHTML += `<div><b>Kilo:</b> ${data.choices[0].message.content}</div>`;
    }
</script>
```
