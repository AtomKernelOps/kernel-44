<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Kilo Terminal</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 90vh; }
        #chat-stream { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; font-size: 0.9rem; }
        .kilo-msg { color: #00ff41; margin-bottom: 10px; }
        .user-msg { color: #aaa; text-align: right; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2 style="font-size: 1rem; border-bottom: 1px solid #333;">KILO TERMINAL // OS-V1</h2>
    <div id="chat-stream">
        <div class="kilo-msg">Kilo: Architectural handshake complete. I am online. How shall we evolve the Kernel today?</div>
    </div>
    <input id="terminal-input" placeholder="Enter command..." onkeydown="handle(event)">

    <script>
        function handle(e) {
            if (e.key === 'Enter') {
                let input = document.getElementById('terminal-input');
                let stream = document.getElementById('chat-stream');
                
                // Add user message
                stream.innerHTML += `<div class="user-msg">${input.value}</div>`;
                
                // Kilo Logic (Hard-coded responses for offline stability)
                let response = "Acknowledged. Updating architecture...";
                if (input.value.toLowerCase().includes('blueprint')) response = "Blueprint stored in local state. Kilo-Verified.";
                if (input.value.toLowerCase().includes('status')) response = "Status: Optimal. Atomic integrity at 99%.";
                
                stream.innerHTML += `<div class="kilo-msg">Kilo: ${response}</div>`;
                input.value = '';
                stream.scrollTop = stream.scrollHeight;
            }
        }
    </script>
</body>
</html>
