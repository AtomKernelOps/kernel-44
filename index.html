<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Kilo-Core</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; }
        .card { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 10px; }
        #stream { height: 300px; overflow-y: auto; padding: 10px; font-size: 0.9rem; }
        input { width: 70%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        button { padding: 10px; border-radius: 6px; background: #007aff; color: #fff; border: none; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>
    <div id="stream" class="card">
        <div><span style="color:#007aff">KILO:</span> System online. Awaiting your command.</div>
    </div>
    <div class="card">
        <input id="cmd" placeholder="Ask Kilo...">
        <button onclick="execute()">RUN</button>
    </div>

    <script>
        function execute() {
            let cmd = document.getElementById('cmd').value.toLowerCase();
            let stream = document.getElementById('stream');
            stream.innerHTML += `<div><span style="color:#aaa">FOUNDER:</span> ${cmd}</div>`;
            
            let response = "Acknowledged. Routing to system logs...";
            if(cmd.includes("status")) response = "System status: OPERATIONAL. All atoms active.";
            if(cmd.includes("blueprint")) response = "Ready to generate. Input concept parameters.";
            
            stream.innerHTML += `<div><span style="color:#007aff">KILO:</span> ${response}</div>`;
            document.getElementById('cmd').value = '';
            stream.scrollTop = stream.scrollHeight;
        }
    </script>
</body>
</html>
