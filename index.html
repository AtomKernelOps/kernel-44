<!-- ADD THIS TO YOUR <body> SECTION -->
<div id="chat-box">
    <div class="chat-header" onclick="toggleChat()">KILO-OS ARCHITECT</div>
    <div id="chat-stream" style="padding: 10px; height: 300px; overflow-y: auto; color: #ccc;"></div>
    <input id="user-input" style="width: 90%; margin: 5px;" placeholder="System command...">
</div>
<button onclick="toggleChat()">ARCHITECT COMM-LINK</button>

<script>
    function toggleChat() {
        const box = document.getElementById('chat-box');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async function sendToKilo() {
        const input = document.getElementById('user-input').value;
        // In production, this fetches from your OpenAI API Key securely
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer YOUR_API_KEY_HERE', 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: "gpt-4",
                messages: [{ role: "system", content: "You are Kilo. Architectural Artist..." }, { role: "user", content: input }]
            })
        });
        const data = await response.json();
        document.getElementById('chat-stream').innerHTML += `<div>Kilo: ${data.choices[0].message.content}</div>`;
    }
</script>
