html
<!-- Kilo-Authorized Chat Atom -->
<div class="card">
    <div id="chat-stream" style="height: 200px; overflow-y: scroll; margin-bottom: 10px; border-bottom: 1px solid #333;"></div>
    <input id="user-input" style="width: 70%; padding: 8px;" placeholder="Message Kilo...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    const API_KEY = "process.env.OPENAI_API_KEY"; // Paste your key here
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const stream = document.getElementById('chat-stream');
        const text = input.value;
        
        stream.innerHTML += `<div><b>You:</b> ${text}</div>`;
        
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [{ role: "system", content: "You are Kilo, the Architectural Artist of Kernel-44..." }, { role: "user", content: text }]
            })
        });
        const data = await response.json();
        stream.innerHTML += `<div><b>Kilo:</b> ${data.choices[0].message.content}</div>`;
        input.value = '';
    }
</script>
