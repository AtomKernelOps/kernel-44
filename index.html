
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | AI OS</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; }
        .chat-container { height: 70vh; display: flex; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        input { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Kernel-44</h1>
    <div class="chat-container">
        <div id="messages"><div><strong>Kilo:</strong> Architecture online. Awaiting directive.</div></div>
        <input id="user-input" placeholder="Architectural command..." onkeydown="if(event.key==='Enter') send()">
    </div>

    <script>
        // NOTE: For a secure production app, you would proxy this key. 
        // For your private OS, you can store your key in Vercel 'Environment Variables'.
        const API_KEY = "YOUR_OPENAI_API_KEY"; 

        async function send() {
            const input = document.getElementById('user-input');
            const msg = input.value;
            document.getElementById('messages').innerHTML += `<div><strong>You:</strong> ${msg}</div>`;
            input.value = '';

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [{role: "system", content: "You are Kilo, Lead Engineer of Kernel-44... (Paste your Kilo Identity Profile here)"}, {role: "user", content: msg}]
                })
            });
            const data = await response.json();
            document.getElementById('messages').innerHTML += `<div><strong>Kilo:</strong> ${data.choices[0].message.content}</div>`;
        }
    </script>
</body>
</html>
