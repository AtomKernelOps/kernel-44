<!-- Kilo-Bridge Atom -->
<div class="card" id="chat-interface">
    <div class="agent-name">Kilo (Lead Engineer)</div>
    <div id="chat-log" style="height: 150px; overflow-y: scroll; margin-bottom: 10px;"></div>
    <input id="user-input" style="width: 70%;" placeholder="Ask Kilo for architecture updates...">
    <button onclick="sendToKilo()">Send</button>
</div>

<script>
    async function sendToKilo() {
        const input = document.getElementById('user-input');
        const log = document.getElementById('chat-log');
        log.innerHTML += `<div><b>Founder:</b> ${input.value}</div>`;
        
        // This connects to the backend proxy we will set up in Vercel
        const response = await fetch('/api/kilo', {
            method: 'POST',
            body: JSON.stringify({ message: input.value })
        });
        const data = await response.json();
        log.innerHTML += `<div><b>Kilo:</b> ${data.reply}</div>`;
        input.value = '';
    }
</script>
