<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44 | Kilo Terminal</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; }
        #terminal { height: 400px; overflow-y: scroll; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        #input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Kernel-44 // Terminal</h1>
    <div id="terminal">
        <div><strong>System:</strong> Kilo Interface Online.</div>
    </div>
    <div id="input-area">
        <input id="user-input" placeholder="Architectural query...">
        <button onclick="sendToKilo()">Execute</button>
    </div>

    <script>
        async function sendToKilo() {
            const input = document.getElementById('user-input');
            const term = document.getElementById('terminal');
            term.innerHTML += `<div><strong>You:</strong> ${input.value}</div>`;
            
            // Logic to send to your OpenAI/Assistant endpoint
            // I will guide you on the final connection logic once you confirm
            term.innerHTML += `<div><strong>Kilo:</strong> Architectural query received. Processing...</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
