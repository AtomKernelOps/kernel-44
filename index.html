<script>
    // This is the persistent chat bridge
    async function sendToKilo() {
        const userInput = document.getElementById('chat-input').value;
        const stream = document.getElementById('stream');
        
        // Display your message
        stream.innerHTML += `<div><span class="agent">Founder:</span> ${userInput}</div>`;
        
        // This is where you connect your API key logic
        // For now, this confirms the bridge is live and operational
        stream.innerHTML += `<div><span class="agent">Kilo:</span> Architecture bridge active. Awaiting your command.</div>`;
        
        document.getElementById('chat-input').value = '';
    }
</script>

<!-- Add this chat interface below your Dashboard card -->
<div class="card">
    <div id="stream" class="stream"></div>
    <input id="chat-input" placeholder="Consult the architect..." style="width: 70%;">
    <button onclick="sendToKilo()">Send</button>
</div>
