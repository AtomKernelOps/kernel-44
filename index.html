
<div class="card" id="kilo-chat">
    <h3>Kilo | Architectural Link</h3>
    <div id="chat-stream" style="height:150px; overflow-y:scroll; border:1px solid #333; padding:5px;"></div>
    <input id="api-key" type="password" placeholder="Paste OpenAI API Key here">
    <input id="chat-input" placeholder="Architectural query...">
    <button onclick="sendToKilo()">Transmit</button>
</div>

<script>
    async function sendToKilo() {
        const key = document.getElementById('api-key').value;
        const input = document.getElementById('chat-input').value;
        const stream = document.getElementById('chat-stream');
        
        stream.innerHTML += `<div>Founder: ${input}</div>`;
        
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [{role: "system", content: "You are Kilo, the Architectural Artist of Kernel-44."}, {role: "user", content: input}]
            })
        });
        const data = await response.json();
        stream.innerHTML += `<div style="color:#00ff41">Kilo: ${data.choices[0].message.content}</div>`;
    }
</script>
