<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel-44</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 20px auto; padding: 0 20px; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
        .tab { display: none; }
        .active { display: block; }
        nav { display: flex; gap: 10px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <button onclick="show('hub')">Hub</button>
        <button onclick="show('build')">Build</button>
        <button onclick="show('pulse')">Pulse</button>
    </nav>

    <div id="hub" class="tab active"><h3>Command Stream</h3><p>System initialized.</p></div>
    <div id="build" class="tab">
        <h3>Blueprint Engine</h3>
        <textarea id="idea" placeholder="What business are we building?"></textarea>
        <button onclick="alert('Blueprint Generated!')">Generate</button>
    </div>
    <div id="pulse" class="tab"><h3>Daily Pulse</h3><p>System Health: 100%</p></div>

    <script>
        function show(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
