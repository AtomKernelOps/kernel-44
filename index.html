<!-- Add this section to your <body> -->
<div class="card">
    <div class="agent-name">Kilo (Lead Engineer)</div>
    <div id="chat-stream" style="height: 150px; overflow-y: auto; font-size: 0.8rem; border: 1px solid #333; margin: 10px 0; padding: 5px;">
        <div>Kilo: Systems online. Awaiting your directive.</div>
    </div>
    <input id="chat-input" placeholder="Consult Kilo..." style="width: 70%;">
    <button onclick="sendToKilo()">Send</button>
</div>

<script>
    async function sendToKilo() {
        const input = document.getElementById('chat-input').value;
        const stream = document.getElementById('chat-stream');
        stream.innerHTML += `<div>You: ${input}</div>`;
        
        // This is where we will pipe your API key calls
        // For now, it logs to console so you can see the connection
        console.log("Sending to Kilo Architecture...", input);
        document.getElementById('chat-input').value = '';
    }
</script>
