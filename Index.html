<script>
    function sendToArk() {
        let msg = document.getElementById('user-input').value;
        let window = document.getElementById('chat-window');
        window.innerHTML += `<div style="color: #aaa;">You: ${msg}</div>`;
        document.getElementById('user-input').value = '';
        
        // This is where we will hook your API Key to process the response
        window.innerHTML += `<div style="color: #00ff41;">Ark: Architectural command received. Processing...</div>`;
    }
</script>

```javascript
<script>
    function logToStream(msg) {
        const stream = document.getElementById('stream');
        const entry = document.createElement('div');
        entry.innerHTML = `> ${msg}`;
        stream.prepend(entry); // Newest logs at the top
    }

    // Simulate system activity
    setInterval(() => {
        const logs = ["Syncing Atoms...", "Establishing neural handshake...", "Kernel-44 stable."];
        logToStream(logs[Math.floor(Math.random() * logs.length)]);
    }, 4000);
</script>
