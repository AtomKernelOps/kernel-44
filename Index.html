<body>
    <h1>Kernel-44</h1>
    <div id="terminal" class="terminal">
        <div class="msg"><span class="agent-kilo">KILO:</span> System bridge active. Standing by for architectural input.</div>
    </div>
    <div class="input-area">
        <input id="prompt" placeholder="Command for Kilo...">
        <button onclick="sendPrompt()">SEND</button>
    </div>

    <script>
        function sendPrompt() {
            const input = document.getElementById('prompt');
            const terminal = document.getElementById('terminal');
            if (!input.value) return;
            
            terminal.innerHTML += `<div class="msg"><span class="agent-founder">YOU:</span> ${input.value}</div>`;
            
            // Engineering Note: This is where we will hook the OpenAI/Agent API
            terminal.innerHTML += `<div class="msg"><span class="agent-kilo">KILO:</span> Processing request... I am currently hard-coded, but link your API key for full neural integration.</div>`;
            
            input.value = '';
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
